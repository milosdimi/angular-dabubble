<h2 mat-dialog-title>Edit Address</h2>

@if (loading) {
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
}

<mat-dialog-content>
  <mat-form-field>
    <mat-label>Phone</mat-label>
    <input matInput type="tel" [(ngModel)]="user.phone" />
  </mat-form-field>

  <div class="form-row">
    <mat-form-field>
      <mat-label>Street</mat-label>
      <input matInput [(ngModel)]="user.street" />
    </mat-form-field>

    <mat-form-field class="form-field-small">
      <mat-label>House no.</mat-label>
      <input matInput type="number" [(ngModel)]="user.houseNumber" />
    </mat-form-field>
  </div>

  <div class="form-row">
    <mat-form-field class="form-field-small">
      <mat-label>Zip code</mat-label>
      <input matInput type="number" [(ngModel)]="user.zipCode" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>City</mat-label>
      <input matInput [(ngModel)]="user.city" />
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" [disabled]="loading">Cancel</button>
  <button mat-flat-button (click)="saveUser()" [disabled]="loading">Save</button>
</mat-dialog-actions>
