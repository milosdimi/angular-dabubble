<h2 mat-dialog-title>Edit User</h2>

@if (loading) {
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
}

<mat-dialog-content>
  <div class="form-row">
    <mat-form-field>
      <mat-label>First name</mat-label>
      <input matInput [(ngModel)]="user.firstName" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Last name</mat-label>
      <input matInput [(ngModel)]="user.lastName" />
    </mat-form-field>
  </div>

  <mat-form-field>
    <mat-label>Birth date</mat-label>
    <input matInput [matDatepicker]="birthdayPicker" [(ngModel)]="birthDate" />
    <mat-datepicker-toggle matIconSuffix [for]="birthdayPicker"></mat-datepicker-toggle>
    <mat-datepicker #birthdayPicker></mat-datepicker>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Email</mat-label>
    <input matInput type="email" [(ngModel)]="user.email" />
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" [disabled]="loading">Cancel</button>
  <button mat-flat-button (click)="saveUser()" [disabled]="loading">Save</button>
</mat-dialog-actions>
